name: Simple Python Static Code Analysis

on:
  push:
    branches: 
      - "**"
  pull_request:
    branches: 
      - "**"

jobs:
  static-analysis:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi
          pip install black isort flake8 pylint mypy pytest coverage pytest-cov

      - name: Run Black formatting check
        run: |
          echo "## Black Code Formatting Check" > report.md
          if black --check --diff .; then
            echo "✅ Black: All files properly formatted" >> report.md
          else
            echo "❌ Black: Formatting issues found" >> report.md
            exit 1
          fi

      - name: Run isort import sorting check
        run: |
          echo "## isort Import Sorting Check" >> report.md
          if isort --check-only --diff .; then
            echo "✅ isort: All imports properly sorted" >> report.md
          else
            echo "❌ isort: Import sorting issues found" >> report.md
            exit 1
          fi

      - name: Run flake8 style check
        run: |
          echo "## flake8 Style Check" >> report.md
          if flake8 --max-line-length=88 --extend-ignore=E203,W503 src/ tests/; then
            echo "✅ flake8: No style issues found" >> report.md
          else
            echo "❌ flake8: Style issues found" >> report.md
            exit 1
          fi

      - name: Run pylint analysis
        run: |
          echo "## Pylint Analysis" >> report.md
          SCORE=$(pylint --score=yes src/ | grep "Your code has been rated at" | sed 's/.*rated at \([0-9.]*\).*/\1/' || echo "0")
          echo "Pylint Score: $SCORE/10" >> report.md
          if python3 -c "exit(0 if float('$SCORE') >= 6.0 else 1)"; then
            echo "✅ Pylint: Score $SCORE/10 meets threshold" >> report.md
          else
            echo "❌ Pylint: Score $SCORE/10 below threshold" >> report.md
            exit 1
          fi

      - name: Run mypy type checking
        run: |
          echo "## MyPy Type Checking" >> report.md
          if mypy --ignore-missing-imports src/; then
            echo "✅ MyPy: No type issues found" >> report.md
          else
            echo "❌ MyPy: Type issues found" >> report.md
            exit 1
          fi

      - name: Run tests with coverage
        run: |
          echo "## Test Coverage" >> report.md
          coverage run -m pytest tests/
          COVERAGE=$(coverage report | grep "TOTAL" | awk '{print $4}' | sed 's/%//')
          echo "Coverage: $COVERAGE%" >> report.md
          if python3 -c "exit(0 if float('$COVERAGE') >= 60 else 1)"; then
            echo "✅ Coverage: $COVERAGE% meets threshold" >> report.md
          else
            echo "❌ Coverage: $COVERAGE% below threshold" >> report.md
            exit 1
          fi

      - name: Generate final report
        if: always()
        run: |
          echo "# 🧪 Python Static Code Analysis Report" > final-report.md
          echo "" >> final-report.md
          cat report.md >> final-report.md
          echo "" >> final-report.md
          echo "✅ All checks passed!" >> final-report.md

      - name: Upload report
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: analysis-report
          path: |
            final-report.md
            .coverage

      - name: Comment PR with results
        uses: actions/github-script@v6
        if: github.event_name == 'pull_request' && always()
        with:
          script: |
            const fs = require('fs');
            try {
              const report = fs.readFileSync('final-report.md', 'utf8');
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: report
              });
            } catch (error) {
              console.log('Could not create PR comment:', error);
            }
